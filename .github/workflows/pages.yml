name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: python -m pip install .
      - run: npm ci --prefix apps/web
      - name: Scan the public source surface
        shell: bash
        run: |
          python -m drawdown_lab.reports.privacy apps/web/public/demo
          if [[ -d reports/published ]]; then
            python -m drawdown_lab.reports.privacy reports/published
          fi
      - name: Build fixed static backup
        env:
          VITE_DATA_MODE: static
          VITE_STATIC_DATA_DATE: "2026-07-31"
        run: npm --prefix apps/web run build -- --base=/drawdown-ledger/
      - name: Include privacy-approved published reports
        shell: bash
        run: |
          if [[ -d reports/published ]]; then
            mkdir -p apps/web/dist/reports
            cp -R reports/published apps/web/dist/reports/published
          fi
          cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
