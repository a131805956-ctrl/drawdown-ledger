name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check apps/api
      - run: python -m mypy apps/api/src
      - run: python -m pytest apps/api/tests/data -q

  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: python -m pip install --upgrade pip
      - shell: pwsh
        run: python -m pip install ".[dev]"
      - shell: pwsh
        run: python -m ruff check apps/api
      - shell: pwsh
        run: python -m mypy apps/api/src
      - shell: pwsh
        run: python -m pytest apps/api/tests/data -q
