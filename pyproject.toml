[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drawdown-lab"
version = "0.1.0"
description = "Evidence-first ETF drawdown research platform"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2.2,<2027",
  "fastapi>=0.115,<0.116",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/drawdown_lab"]

[tool.hatch.build.targets.wheel.force-include]
"apps/api/templates/report.html.j2" = "drawdown_lab/templates/report.html.j2"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps/api/src"]

[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true
