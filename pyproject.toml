[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drawdown-lab"
version = "0.1.0"
description = "Evidence-first ETF drawdown research platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/drawdown_lab"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps/api/src"]

[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true
