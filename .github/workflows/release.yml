name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify reviewed main and successful CI provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "${release_commit}" origin/main
          ci_run_id=$(
            gh run list \
              --workflow CI \
              --commit "${release_commit}" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )
          test -n "${ci_run_id}"
      - name: Validate release version
        shell: bash
        run: |
          project_version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as source:
              print(tomllib.load(source)["project"]["version"])
          PY
          )
          test "v${project_version}" = "${GITHUB_REF_NAME}"
      - name: Build source archive
        shell: bash
        run: |
          mkdir -p release
          git archive \
            --format=zip \
            --prefix="drawdown-ledger-${GITHUB_REF_NAME}/" \
            --output="release/drawdown-ledger-${GITHUB_REF_NAME}.zip" \
            "${GITHUB_REF_NAME}"
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --generate-notes
          --title "Drawdown Ledger ${GITHUB_REF_NAME}"
