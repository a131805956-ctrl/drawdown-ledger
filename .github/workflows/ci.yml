name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check apps/api
      - run: python -m mypy apps/api/src
      - run: python -m pytest -q
      - run: python -m drawdown_lab.reports.privacy apps/web/public/demo

  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: python -m pip install --upgrade pip
      - shell: pwsh
        run: python -m pip install ".[dev]"
      - shell: pwsh
        run: python -m ruff check apps/api
      - shell: pwsh
        run: python -m mypy apps/api/src
      - shell: pwsh
        run: python -m pytest -q
      - shell: pwsh
        run: python -m drawdown_lab.reports.privacy apps/web/public/demo
      - name: Run PowerShell 5.1 publication tests
        shell: powershell
        run: |
          if ((Get-Command Invoke-Pester).Parameters.ContainsKey('Path')) {
            $result = Invoke-Pester -Path '.\scripts\tests\Publish-Report.Tests.ps1' -PassThru
          }
          else {
            $result = Invoke-Pester -Script '.\scripts\tests\Publish-Report.Tests.ps1' -PassThru
          }
          if ($result.FailedCount -gt 0) {
            exit 1
          }
