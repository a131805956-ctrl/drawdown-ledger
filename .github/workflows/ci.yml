name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check apps/api
      - run: python -m mypy apps/api/src
      - run: python -m pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install .
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run check:api
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run test -- --run
      - run: npm --prefix apps/web run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: python -m pip install .
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:static
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-static
            test-results
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - shell: pwsh
        run: python -m pip install --upgrade pip
      - shell: pwsh
        run: python -m pip install ".[dev]"
      - shell: pwsh
        run: python -m ruff check apps/api
      - shell: pwsh
        run: python -m mypy apps/api/src
      - shell: pwsh
        run: python -m pytest -q
      - name: Run lifecycle tests with Windows PowerShell
        shell: powershell
        run: |
          $pester3 = Get-Module -ListAvailable Pester |
            Where-Object Version -EQ ([version]'3.4.0') |
            Select-Object -First 1
          if ($null -eq $pester3) {
            $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester3'
            Save-Module `
              -Name Pester `
              -RequiredVersion 3.4.0 `
              -Path $moduleRoot `
              -Force
            $pester3 = Get-Module `
              -ListAvailable `
              (Join-Path $moduleRoot 'Pester\3.4.0\Pester.psd1')
          }
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module $pester3.Path -Force
          if ((Get-Module Pester).Version -ne [version]'3.4.0') {
            throw 'Lifecycle tests require Pester 3.4.0.'
          }
          $result = Invoke-Pester -Script '.\tests\powershell\*.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run publication tests with Pester 5
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path '.\scripts\tests\Publish-Report.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }
      - name: Run Windows PowerShell 5.1 publication tests
        shell: powershell
        run: |
          if ((Get-Command Invoke-Pester).Parameters.ContainsKey('Path')) {
            $result = Invoke-Pester -Path '.\scripts\tests\Publish-Report.Tests.ps1' -PassThru
          }
          else {
            $result = Invoke-Pester -Script '.\scripts\tests\Publish-Report.Tests.ps1' -PassThru
          }
          if ($result.FailedCount -gt 0) {
            exit 1
          }

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: >-
          python -m pytest
          apps/api/tests/test_privacy_boundaries.py
          apps/api/tests/reports/test_privacy.py
          apps/api/tests/reports/test_publication.py
          -q
      - run: python -m drawdown_lab.reports.privacy apps/web/public/demo
      - name: Scan explicitly published reports
        shell: bash
        run: |
          if [[ -d reports/published ]]; then
            python -m drawdown_lab.reports.publication reports/published
          fi
